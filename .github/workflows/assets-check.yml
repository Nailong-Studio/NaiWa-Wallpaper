name: Assets Check

on:
  push:
    paths:
      - "assets.json"
      - "thumbs/**"
      - "classic/**"
      - "laugh-gallery/**"
      - "emotes/**"
      - "poses/**"
      - "mobile/**"
      - "art/**"
      - "hd/**"
      - "4k/**"
      - "frames/**"
      - "videos/**"
      - "assets/**"
      - "scripts/build_assets.py"
  pull_request:
    paths:
      - "assets.json"
      - "thumbs/**"
      - "classic/**"
      - "laugh-gallery/**"
      - "emotes/**"
      - "poses/**"
      - "mobile/**"
      - "art/**"
      - "hd/**"
      - "4k/**"
      - "frames/**"
      - "videos/**"
      - "assets/**"
      - "scripts/build_assets.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Verify assets.json and thumbnails
        run: python3 scripts/build_assets.py --check
