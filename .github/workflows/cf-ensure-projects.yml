name: Ensure Cloudflare Pages Projects
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create Pages projects (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for p in nailoong-wallpaper nailoong-universe; do
            echo "== $p"
            npx --yes wrangler@3 pages project create "$p" --production-branch=main 2>&1 | tail -20 || true
            npx --yes wrangler@3 pages project list 2>&1 | tail -20 || true
          done
