name: Retire legacy Cloudflare Pages projects
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Delete legacy projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          npx --yes wrangler@3 pages project delete nailong-wallpaper --yes 2>&1 | tail -5 || true
          npx --yes wrangler@3 pages project delete nailong-universe --yes 2>&1 | tail -5 || true
          npx --yes wrangler@3 pages project list 2>&1 | tail -20 || true
