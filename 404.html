<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>走错滩头 · 奶蛙世界</title>
<script>
try{var t=localStorage.getItem('naiwa-world-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
:root{
  --bg:#0d0c09;--bg2:#13110c;--panel:#191610;--line:#342b1d;
  --ink:#efe5cf;--muted:#a79b82;--gold:#f1c24d;
  --display:"STKaiti","KaiTi","PingFang SC","Microsoft YaHei",sans-serif;
  --body:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f6efdd;--bg2:#efe4cb;--panel:#fffaf0;--line:#d8c7a4;
  --ink:#2d2618;--muted:#74684f;--gold:#a86f0d;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1000px,92vw);margin:0 auto}
.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:var(--bg)}
.top__in{width:min(1000px,92vw);margin:0 auto;display:flex;align-items:center;gap:12px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:20px;letter-spacing:.04em;white-space:nowrap}
.brand img{width:30px;height:30px;object-fit:cover;border:1px solid var(--line)}
.theme{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:17px}
.theme:hover{color:var(--gold);border-color:var(--gold)}
main{padding:clamp(52px,10vw,110px) 0 clamp(60px,10vw,120px)}
.stamp{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-family:var(--display);font-size:13px;padding:5px 10px;transform:rotate(-2deg);margin-bottom:26px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(58px,14vw,128px);line-height:.92;letter-spacing:-.04em}
h1 span{display:block;color:var(--gold)}
.lede{max-width:34em;margin-top:24px;color:var(--muted);font-size:17px}
.links{display:flex;flex-wrap:wrap;gap:14px 24px;margin-top:34px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;text-decoration:none;font-size:13px;letter-spacing:.04em}
.btn:hover{background:transparent;color:var(--ink)}
.link{color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.link:hover{color:var(--gold);border-color:var(--gold)}
.foot{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:11px;letter-spacing:.04em}
@media(max-width:520px){.top__in{min-height:58px}.brand{font-size:18px}.brand img{width:26px;height:26px}.lede{font-size:15px}}
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <a class="brand" href="/"><img src="/thumbs/assets/%E5%A5%B6%E8%9B%99-logo.webp" alt=""><b>奶蛙世界</b></a>
    <button class="theme" id="theme" type="button" aria-label="切换明暗主题">☾</button>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="stamp">404 · 走错滩头</div>
    <h1>这片滩<span>没有东西。</span></h1>
    <p class="lede">地址可能拼错了，或者这件藏品已经搬走。回到地图，从九座聚落重新走一遍。</p>
    <div class="links">
      <a class="btn" href="/">回奶蛙世界 →</a>
      <a class="link" href="/zones">看九座聚落</a>
      <a class="link" href="/collection">直接去藏品滩</a>
      <a class="link" href="/history">读奶蛙简史</a>
      <a class="link" href="/assets.json">assets.json</a>
    </div>
  </div>
</main>
<footer class="foot"><div class="wrap">NAIWA WORLD / Nailong-Studio · 404</div></footer>
<script>
const btn=document.getElementById('theme');
function setTheme(t){document.documentElement.dataset.theme=t;btn.textContent=t==='light'?'☀':'☾';try{localStorage.setItem('naiwa-world-theme',t);}catch(e){}}
setTheme(document.documentElement.dataset.theme||'dark');
btn.addEventListener('click',function(){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');});
</script>
</body>
</html>
